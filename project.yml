name: Jimmy
options:
  bundleIdPrefix: com.chenkahana
  deploymentTarget:
    iOS: "27.0"
    watchOS: "27.0"
  autogenerateSchemes: false
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    exactVersion: 7.12.0
  JimmyKit:
    path: Packages/JimmyKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEVELOPMENT_TEAM: DPF8459C2J
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "7.2"
    CURRENT_PROJECT_VERSION: "7.2"
    TARGETED_DEVICE_FAMILY: "1"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    CLANG_CXX_LANGUAGE_STANDARD: "gnu++20"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  Jimmy:
    type: application
    platform: iOS
    sources:
      - path: Jimmy
        excludes:
          - Info.plist
          - "*.entitlements"
    dependencies:
      - package: GRDB
      - package: JimmyKit
      - target: JimmyWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chenkahana.Jimmy
        CODE_SIGN_ENTITLEMENTS: Jimmy/Jimmy.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Jimmy/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        INFOPLIST_KEY_CFBundleDisplayName: Jimmy
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.entertainment"
        INFOPLIST_KEY_NSAppleMusicUsageDescription: "To import your Apple Podcasts subscriptions"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDarkContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
  JimmyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/JimmyTests
    dependencies:
      - target: Jimmy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chenkahana.JimmyTests
        # XCTestCase's initializers and setUp/tearDown are nonisolated, so test classes can't default to MainActor.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Jimmy.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Jimmy"
  JimmyWatch:
    type: application
    platform: watchOS
    sources:
      - path: JimmyWatch
    dependencies:
      - package: JimmyKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chenkahana.Jimmy.watchkitapp
        DEVELOPMENT_TEAM: DPF8459C2J
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        INFOPLIST_KEY_CFBundleDisplayName: Jimmy
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.chenkahana.Jimmy
schemes:
  Jimmy:
    build:
      targets:
        Jimmy: all
        JimmyWatch: all
        JimmyTests: [test]
    test:
      targets:
        - JimmyTests
  JimmyWatch:
    build:
      targets:
        JimmyWatch: all
    run:
      config: Debug
